services:
  # ============================================================
  # 1. FastAPI Backend Web Service (Edge Fog Engine + API)
  # ============================================================
  - type: web
    name: smart-parking-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./smartparking.db

  # ============================================================
  # 2. Vite React Frontend Static Site (Responsive Client Portal)
  # ============================================================
  - type: web
    name: smart-parking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
